name: preflight

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    # Untrusted code never reaches the self-hosted runner: a pull request from a fork runs only when the
    # repository is public (and then on a hosted runner). A private repository runs on its own arm64
    # runner; a public one on the free hosted arm64 image.
    if: ${{ !github.event.repository.private || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","arm64"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No `version:` — the action reads `packageManager` from package.json; passing both is an error.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node 26 on purpose: the env-proxy test in test/render/render.spec.ts needs http.setGlobalProxyFromEnv (Node >= 24) and
          # is skipped below it, so a lower pin would silently drop that check.
          node-version: 26.13.1
      - run: pnpm install --frozen-lockfile
      - run: make preflight
      # The release gate, run on every pull request: pack the built package, install the tarball into a clean project and
      # import every entry. It used to run only after the release tag, so v0.7.0 and v0.7.1 were tagged and then failed to
      # publish on mistakes a pull request could have caught.
      - run: node scripts/verify-pack.mjs
      # What lives in the Next layer (HEAD, route wiring, the page cache) is only seen over HTTP: build the dev app,
      # serve it with `next start` and probe a card, a stale ?v, an unknown slug and a REST upload. Needs the build above.
      - run: node scripts/probe-dev-server.mjs

  # The package declares engines ^22.23.5 || ^24.22.3 || >=26.13.1. `preflight` runs on 26.13.1; this runs the suite on the
  # other two declared lines so a Node API that only exists on the newest one cannot ship unseen.
  runtime-compat:
    if: ${{ !github.event.repository.private || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","arm64"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.5, 24.22.3]
    name: runtime-compat (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Payload 4 support, a gate like `preflight`: the type check, the suite, the public surface and the dev-app HTTP probe against two Payload 4 betas:
  # the floor the peer range claims (`^4.0.0-beta.N`) and the newest one every @payloadcms/* package has cleared the release-age cooldown on
  # (the same version while the floor is the newest). Nothing from this job ships or is committed back.
  payload-beta:
    if: ${{ !github.event.repository.private || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","arm64"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [floor, newest]
    name: payload-beta (${{ matrix.target }})
    env:
      PAYLOAD_CONFIG_PATH: dev/payload.config.ts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - run: pnpm install --frozen-lockfile
      # One exact version for every @payloadcms/* package (Payload 4 pins them to each other). The picker applies the release-age
      # cooldown to every package it installs, so pnpm's own check is lifted only for those (`minimumReleaseAgeExclude` in the
      # checkout's workspace file, never committed); everything else the beta resolves keeps the 24 h cooldown.
      # Binaries are called directly after it: `pnpm run` would re-check.
      - run: |
          beta=$(node scripts/latest-payload-beta.mjs ${{ matrix.target }})
          echo "Payload beta (${{ matrix.target }}): $beta"
          printf 'minimumReleaseAgeExclude:\n  - payload\n  - "@payloadcms/*"\n' >> pnpm-workspace.yaml
          pnpm add --save-dev --save-exact $(node scripts/latest-payload-beta.mjs specs "$beta")
      - name: Type check against the beta types (src, tests, dev app)
        run: |
          node_modules/.bin/tsc --noEmit
          node_modules/.bin/tsc -p dev/tsconfig.json --noEmit
      - name: Suite
        run: node_modules/.bin/vitest run
      - name: Build and public surface
        run: |
          node_modules/.bin/rimraf dist
          node_modules/.bin/tsc -p tsconfig.build.json
          for c in api-extractor api-extractor.next api-extractor.testing api-extractor.client api-extractor.mcp api-extractor.mcpv3; do node_modules/.bin/api-extractor run -c "$c.json"; done
      # The committed import map is Payload 3's output (`@payloadcms/next/rsc` is gone in 4): regenerate it before the app is built.
      - run: node_modules/.bin/payload generate:importmap
      - run: node scripts/probe-dev-server.mjs
